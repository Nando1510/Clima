<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Fernando - Previsão do tempo</title>
</head>

<body>
    <div class="caixa-maior">
        <!-- Caixa de pesquisa adicionada para alinhar os elementos corretamente -->
        <div class="caixa-pesquisa">
            <input class="input-cidade" placeholder="Digite o nome da cidade">
            <button class="botao-busca" onclick="cliqueinoBotao()">
                <img class="img-busca" alt="Busca" src="https://www.svgrepo.com/show/488200/find.svg">
            </button>
        </div>

        <div class="caixa-media">
            <h2 class="cidade">Tempo em Canoas</h2>
            
            <p class="temp">21°C</p>
           
            <div class="caixa-menor">
                <img class="img-previsao" alt="icone-info-tempo" src="https://openweathermap.org/img/wn/04n.png">
                <p class="texto-previsao">Nublado</p>
            </div>
            <p class="umidade">Umidade: 76%</p>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
